<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Zyron</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-left">
                <button type="button" class="nav-link nav-btn" aria-label="Open menu" data-menu-trigger>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                    <span>Menu</span>
                </button>
                <a href="search.html" class="nav-link nav-active" aria-label="Search" id="header-search-link">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <span>Search</span>
                </a>
            </div>
            <a href="../index.html" class="brand">Zyron</a>
            <div class="nav-right">
                <a href="wishlist.html" class="nav-link" aria-label="Wishlist">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <span>Favourite</span>
                </a>
                <a href="profile.html" class="nav-link" aria-label="Profile">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>Profile</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Slide menu overlay -->
    <div class="menu-overlay" data-menu-overlay aria-hidden="true"></div>

    <!-- Slide menu panel -->
    <aside class="slide-menu" data-slide-menu aria-hidden="true">
        <button type="button" class="slide-menu-close" aria-label="Close menu" data-menu-close>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <nav class="slide-menu-nav">
            <a href="shoes.html" class="slide-menu-item">Shoes</a>
            <a href="handbags.html" class="slide-menu-item">Handbags</a>
            <a href="women.html" class="slide-menu-item">Women</a>
            <a href="watches.html" class="slide-menu-item">Watches</a>
            <a href="men.html" class="slide-menu-item">Men</a>
            <a href="jewellery.html" class="slide-menu-item">Jewellery</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-content">
            <h1 class="page-title">Search</h1>
            <p class="page-subtitle">Find products across our catalog</p>
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="search" placeholder="Search for products..." class="search-input" aria-label="Search products" id="search-input">
            </div>
            <div class="product-grid" id="search-results"></div>
            <p id="no-results-message" style="display: none;">No products found</p>
        </div>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/product-detail.js"></script> <!-- Ensure products data is loaded -->
    <script src="../js/search.js"></script>
</body>
</html>
